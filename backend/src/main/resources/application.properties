spring.config.import=optional:file:./email.properties,optional:file:./backend/email.properties,optional:file:./application-local.properties,optional:file:./backend/application-local.properties

# Arquivo versionado: nao coloque credenciais reais aqui.
# No servidor, configure as variaveis SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD.
# Na sua maquina, use backend/application-local.properties, que fica no .gitignore.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/unimarket}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:unimarket}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:unimarket}

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/unimarket-api-docs
springdoc.swagger-ui.customCssUrl=/swagger-ui/swagger-custom.css
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Segredo do JWT. Nunca versionar o valor real de producao.
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:${JWT_SECRET:change-me-local-dev-secret}}

# Configuracoes de e-mail ficam em variaveis de ambiente ou email.properties local ignorado.
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT:5000}

app.mail.from=no-reply@unimarket.local

# Chave usada apenas no backend para geocodificar enderecos de mercado.
app.google.maps.api-key=${APP_GOOGLE_MAPS_API_KEY:${GOOGLE_MAPS_API_KEY:}}

# Client ID OAuth 2.0 usado para validar o login com Google do frontend.
app.google.oauth.client-id=${APP_GOOGLE_OAUTH_CLIENT_ID:${GOOGLE_OAUTH_CLIENT_ID:952864792771-dm3461l4jcpco235rarq0ljjuh1navd0.apps.googleusercontent.com}}

# Cosmos complementa dados de produto por codigo de barras. Token real fica fora do Git.
cosmos.api.url=${COSMOS_API_URL:https://api.cosmos.bluesoft.com.br}
cosmos.api.token=${COSMOS_API_TOKEN:}
cosmos.api.user-agent=${COSMOS_API_USER_AGENT:Cosmos-API-Request}
