spring.config.import=optional:file:./email.properties,optional:file:./backend/email.properties,optional:file:./application-local.properties,optional:file:./backend/application-local.properties,optional:file:./backend/src/main/resources/application-local.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/unimarket
spring.datasource.username=unimarket
spring.datasource.password=DB_PASSWORD_REMOVED

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/unimarket-api-docs
springdoc.swagger-ui.customCssUrl=/swagger-ui/swagger-custom.css
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

api.security.token.secret=${JWT_SECRET:change-me-local-dev-secret}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=no-reply@unimarket.local

app.google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

