spring.config.import=optional:file:./email.properties,optional:file:./backend/email.properties

spring.datasource.url=jdbc:postgresql://localhost:5432/Unimarket
spring.datasource.username=postgres
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

springdoc.swagger-ui.path=/unimarket-api-docs
springdoc.swagger-ui.customCssUrl=/swagger-ui/swagger-custom.css
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

api.security.token.secret=${JWT_SECRET:unimarket_chave_local_secreta_dev_12345}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@unimarket.local}}

app.google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

